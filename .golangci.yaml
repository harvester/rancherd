version: 2
linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - misspell
    - ineffassign
    - unused
  formatters:
    enable:
      - gofmt
      - goimports
  exclude-files:
    - /zz_generated_
  exclude-dirs:
    - generated
  exclusions:
    rules:
      - linters:
          - revive
        text: "should have comment or be unexported:"
run:
  timeout: 5m
  tests: true
